<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="icon/png" href="/static/icon.png">


    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1d4350, #31a454);
            font-family: 'Segoe UI', sans-serif;
        }

        .register-box {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 450px;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .title {
            font-weight: 700;
            color: #333;
        }

        .form-control {
            border-radius: 8px;
        }

        .btn-register {
            background: linear-gradient(45deg, #1d4350, #31a454);
            color: white;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-register:hover {
            transform: scale(1.03);
            opacity: 0.9;
        }

        .extra-links a {
            text-decoration: none;
            color: #2c5364;
            font-weight: 500;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="register-box">
    <h3 class="text-center title mb-4">Create Account</h3>
    <form method="post" action="/register/">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" placeholder="Enter full name" name="fullname" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" placeholder="Enter email" name="email" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" placeholder="Choose username" name="username" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" placeholder="Create password" name="password" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-control" placeholder="Confirm password" name="confirm_password" required>
        </div>
        <div class="d-grid">
            <button type="submit" class="btn btn-register">Register</button>
        </div>
        <div class="text-center mt-3 extra-links">
            <p>Already have an account? <a href="/login">Login</a></p>
        </div>
    </form>
</div>

</body>
</html>
