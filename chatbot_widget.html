<!-- Professional Chatbot Widget for Farmer Queries -->
<div id="chatbot-container" style="position: fixed; bottom: 24px; right: 24px; z-index: 1100;">

    <!-- Chat Window -->
    <div id="chatbot-widget" class="shadow border">

        <!-- Header -->
        <div class="chat-header d-flex justify-content-between align-items-center">
            <span class="fw-bold">🌾 AgriNova Chatbot</span>
            <button id="chatbot-close">&times;</button>
        </div>

        <!-- Messages -->
        <div id="chatbot-messages"></div>

        <!-- Input -->
        <div class="chat-input-area">
            <form id="chatbot-form" class="d-flex">
                <input type="text" id="chatbot-input" placeholder="Ask your question..." autocomplete="off" required>
                <button type="submit">Send</button>
            </form>
        </div>
    </div>

    <!-- Floating Button -->
    <button id="chatbot-open">
        <i class="fas fa-comments"></i>
    </button>
</div>


<style>
/* Chat Window */
#chatbot-widget {
    width: 500px;
    height: 550px;
    background: white;
    border-radius: 18px;
    display: none;
    flex-direction: column;
    overflow: hidden;
    animation: slideUp 0.3s ease;
}

/* Slide Animation */
@keyframes slideUp {
    from { transform: translateY(40px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

/* Header */
.chat-header {
    background: linear-gradient(135deg, #28a745, #20c997);
    color: white;
    padding: 15px;
    font-size: 18px;
}

#chatbot-close {
    background: white;
    border: none;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    cursor: pointer;
}

/* Messages Area */
#chatbot-messages {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    background: #f4f6f9;
}

/* Chat Bubbles */
.chat-bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 15px;
    font-size: 14px;
    line-height: 1.5;
    display: inline-block;
}

.user-bubble {
    background: #28a745;
    color: white;
    border-bottom-right-radius: 4px;
}

.bot-bubble {
    background: #e9ecef;
    color: #333;
    border-bottom-left-radius: 4px;
}

/* Input Area */
.chat-input-area {
    padding: 10px;
    border-top: 1px solid #ddd;
}

#chatbot-input {
    flex: 1;
    border-radius: 20px;
    padding: 8px 15px;
    border: 1px solid #ccc;
    outline: none;
}

.chat-input-area button {
    margin-left: 8px;
    border-radius: 20px;
    padding: 6px 18px;
    border: none;
    background: linear-gradient(135deg, #28a745, #20c997);
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

.chat-input-area button:hover {
    transform: scale(1.05);
}

/* Floating Button */
#chatbot-open {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #28a745, #20c997);
    color: white;
    font-size: 22px;
    box-shadow: 0 8px 20px rgba(0,128,0,0.3);
    cursor: pointer;
    transition: 0.3s;
}

#chatbot-open:hover {
    transform: scale(1.1);
}
</style>


<script>
document.addEventListener('DOMContentLoaded', function() {

    const chatbotToggle = document.getElementById('chatbot-open');
    const chatbotWidget = document.getElementById('chatbot-widget');
    const chatbotClose = document.getElementById('chatbot-close');
    const chatbotForm = document.getElementById('chatbot-form');
    const chatbotInput = document.getElementById('chatbot-input');
    const chatbotMessages = document.getElementById('chatbot-messages');

    let conversationHistory = [];
    let isLoading = false;

    function addMessage(sender, text) {
        const wrapper = document.createElement('div');
        wrapper.className = sender === 'user' ? 'text-end mb-2' : 'text-start mb-2';

        const bubble = document.createElement('div');
        bubble.className = sender === 'user'
            ? 'chat-bubble user-bubble'
            : 'chat-bubble bot-bubble';

        bubble.innerHTML = text.replace(/\n/g, '<br>');
        wrapper.appendChild(bubble);
        chatbotMessages.appendChild(wrapper);
        chatbotMessages.scrollTop = chatbotMessages.scrollHeight;
    }

    function showTyping() {
        const indicator = document.createElement('div');
        indicator.className = 'text-start mb-2';
        indicator.id = 'typing-indicator';
        indicator.innerHTML = `<div class="chat-bubble bot-bubble">Typing...</div>`;
        chatbotMessages.appendChild(indicator);
        chatbotMessages.scrollTop = chatbotMessages.scrollHeight;
    }

    function removeTyping() {
        const ind = document.getElementById('typing-indicator');
        if (ind) ind.remove();
    }

    function sendMessage(userMsg) {
        if (!userMsg || isLoading) return;

        addMessage('user', userMsg);
        chatbotInput.value = '';
        isLoading = true;
        showTyping();

        fetch('/ai-chat/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: userMsg, history: conversationHistory })
        })
        .then(res => res.json())
        .then(data => {
            removeTyping();

            if (data.error) {
                addMessage('bot', 'Error: ' + data.error);
            } else {
                addMessage('bot', data.reply);

                conversationHistory.push({ role: 'user', content: userMsg });
                conversationHistory.push({ role: 'assistant', content: data.reply });

                if (conversationHistory.length > 20) {
                    conversationHistory = conversationHistory.slice(-20);
                }
            }
        })
        .catch(() => {
            removeTyping();
            addMessage('bot', 'Failed to contact server.');
        })
        .finally(() => {
            isLoading = false;
            chatbotInput.focus();
        });
    }

    // OPEN CHAT
    chatbotToggle.addEventListener('click', function() {
        chatbotWidget.style.display = 'flex';
        chatbotToggle.style.display = 'none';
        chatbotInput.focus();

        if (chatbotMessages.innerHTML.trim() === '') {
            addMessage('bot',
                "Welcome! 🌾 I am your agricultural assistant.\n\n" +
                "You can ask about:\n" +
                "• Crop cultivation\n" +
                "• Fertilizers\n" +
                "• Irrigation\n" +
                "• Pest control\n" +
                "• Government schemes"
            );
        }
    });

    // CLOSE CHAT
    chatbotClose.addEventListener('click', function() {
        chatbotWidget.style.display = 'none';
        chatbotToggle.style.display = 'block';
    });

    // FORM SUBMIT (NO PAGE REFRESH)
    chatbotForm.addEventListener('submit', function(e) {
        e.preventDefault();
        sendMessage(chatbotInput.value.trim());
    });

});
</script>
