<!DOCTYPE html>
<html>
<head>
<title>Forgot Password</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:linear-gradient(135deg,#1d4350,#31a454);height:100vh;display:flex;justify-content:center;align-items:center;">

<div class="card p-4" style="width:400px;">
<h3 class="text-center mb-3">Reset Password</h3>

<form method="POST">
{% csrf_token %}

<div class="mb-3">
<label>Username</label>
<input type="text" name="username" class="form-control" required>
</div>

<div class="mb-3">
<label>New Password</label>
<input type="password" name="new_password" class="form-control" required>
</div>

<button class="btn btn-success w-100">Change Password</button>

</form>

{% if success %}
<p class="text-success mt-3">{{success}}</p>
{% endif %}

{% if error %}
<p class="text-danger mt-3">{{error}}</p>
{% endif %}

<a href="/login/" class="d-block text-center mt-3">Back to Login</a>

</div>

</body>
</html>
