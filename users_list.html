<h2>Registered Users</h2>
<table border="1" cellpadding="8">
    <tr>
        <th>Username</th>
        <th>Email</th>
        <th>Password</th>
         <th>Fullname</th>
    </tr>
    {% for user in users %}
    <tr>
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.password }}</td>
        <td>{{ user.fullname }}</td>

    </tr>
    {% endfor %}
</table>
